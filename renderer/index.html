<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iron Man Jarvis 3D AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #00f3ff;
    }
    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Hidden webcam input */
    #webcam-video {
      display: none;
    }
    /* Debug landmark canvas overlay */
    #landmark-canvas {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 220px;
      height: 140px;
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 8px;
      background: rgba(0, 5, 15, 0.7);
      z-index: 10;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.3s;
    }
    #landmark-canvas.hidden {
      display: none;
    }

    /* Iron Man Jarvis HUD Overlays */
    .hud-header {
      position: absolute;
      top: 20px;
      left: 25px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    .hud-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
    }
    .hud-status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid #00f3ff;
      color: #00f3ff;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
      transition: all 0.3s;
    }
    .hud-status-badge.listening {
      background: rgba(0, 255, 128, 0.2);
      border-color: #00ff80;
      color: #00ff80;
      box-shadow: 0 0 12px rgba(0, 255, 128, 0.6);
    }
    .hud-status-badge.speaking {
      background: rgba(255, 180, 0, 0.2);
      border-color: #ffb400;
      color: #ffb400;
      box-shadow: 0 0 12px rgba(255, 180, 0, 0.6);
    }
    .hud-status-badge.thinking {
      background: rgba(255, 0, 128, 0.2);
      border-color: #ff0080;
      color: #ff0080;
      box-shadow: 0 0 12px rgba(255, 0, 128, 0.6);
    }

    /* Subtitle & Response Panel */
    .hud-response-box {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 800px;
      padding: 16px 24px;
      background: rgba(2, 10, 25, 0.75);
      border: 1px solid rgba(0, 243, 255, 0.35);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
      color: #e0f8ff;
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
      z-index: 10;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    /* Active Gesture Debug Info */
    .hud-gesture-info {
      position: absolute;
      bottom: 25px;
      left: 25px;
      z-index: 10;
      font-size: 12px;
      color: rgba(0, 243, 255, 0.7);
      background: rgba(0, 5, 15, 0.6);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 243, 255, 0.2);
      pointer-events: auto;
    }
    .hud-btn {
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0, 243, 255, 0.2);
      border: 1px solid #00f3ff;
      color: #ffffff;
      font-size: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .hud-btn:hover {
      background: rgba(0, 243, 255, 0.4);
    }
  </style>

  <!-- Three.js & Postprocessing CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- 3D WebGL Canvas -->
  <div id="webgl-container"></div>

  <!-- Hidden Webcam Video Element for MediaPipe -->
  <video id="webcam-video" playsinline></video>

  <!-- Debug Landmark Canvas Overlay -->
  <canvas id="landmark-canvas" width="220" height="140"></canvas>

  <!-- Iron Man Jarvis HUD Interface -->
  <div class="hud-header">
    <div class="hud-title">NEHA JARVIS 3D</div>
    <div id="hud-status" class="hud-status-badge">ONLINE • STANDBY</div>
  </div>

  <div id="hud-response" class="hud-response-box">
    🖐️ 3D Gesture Control active. Open Palm: Listen | Fist: Idle | 2 Fists: Scale | Wrist: Rotate | Swipe: Nav
  </div>

  <div class="hud-gesture-info">
    <div><strong>Active Gesture:</strong> <span id="gesture-name">None</span></div>
    <div><strong>Orb Scale:</strong> <span id="orb-scale-val">1.00</span></div>
    <button class="hud-btn" onclick="toggleDebugOverlay()">Toggle Hand Tracking Canvas</button>
  </div>

  <!-- Custom Renderer Scripts -->
  <script src="orb.js"></script>
  <script src="gestures.js"></script>
  <script src="app.js"></script>
</body>
</html>
